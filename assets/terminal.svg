<svg width="640" height="240" viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg { fill: #0A0A0A; }
    .border {
      fill: none;
      stroke: #2A2A2A;
      stroke-width: 1.5;
      animation: glow 3.5s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { stroke: #2A2A2A; }
      50% { stroke: #5A5A5A; }
    }
    .label { fill: #666666; font-family: 'Courier New', monospace; font-size: 15px; }
    .value { fill: #FFFFFF; font-family: 'Courier New', monospace; font-size: 15px; }
    .line {
      opacity: 0;
      animation: reveal 0.4s ease forwards;
    }
    .l1 { animation-delay: 0.2s; }
    .l2 { animation-delay: 0.9s; }
    .l3 { animation-delay: 1.6s; }
    .l4 { animation-delay: 2.3s; }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cursor {
      fill: #FFFFFF;
      animation: blink 1s step-end infinite;
      animation-delay: 2.6s;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .path { fill: #777777; font-family: 'Courier New', monospace; font-size: 13px; }
  </style>

  <rect class="bg" width="640" height="240" rx="12"/>
  <rect class="border" x="1.5" y="1.5" width="637" height="237" rx="12"/>

  <text x="28" y="40" class="path">/usr/bin/bUecoding</text>
  <line x1="28" y1="54" x2="612" y2="54" stroke="#222222" stroke-width="1"/>

  <g class="line l1">
    <text x="28" y="94" class="label">USER</text>
    <text x="160" y="94" class="value">bUecoding</text>
  </g>

  <g class="line l2">
    <text x="28" y="128" class="label">ROLE</text>
    <text x="160" y="128" class="value">Backend / Full-Stack Developer</text>
  </g>

  <g class="line l3">
    <text x="28" y="162" class="label">ORIGIN</text>
    <text x="160" y="162" class="value">Brazil</text>
  </g>

  <g class="line l4">
    <text x="28" y="196" class="label">STATUS</text>
    <text x="160" y="196" class="value">Building...</text>
    <rect class="cursor" x="330" y="184" width="9" height="16"/>
  </g>
</svg>
