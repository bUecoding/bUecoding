<svg width="560" height="200" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg { fill: #0A0A0A; }
    .border {
      fill: none;
      stroke: #2A2A2A;
      stroke-width: 1.5;
      rx: 10;
      animation: glow 3.5s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { stroke: #2A2A2A; }
      50% { stroke: #555555; }
    }
    .label { fill: #666666; font-family: 'Courier New', monospace; font-size: 13px; }
    .value { fill: #FFFFFF; font-family: 'Courier New', monospace; font-size: 13px; }
    .line {
      opacity: 0;
      animation: reveal 0.4s ease forwards;
    }
    .l1 { animation-delay: 0.2s; }
    .l2 { animation-delay: 0.9s; }
    .l3 { animation-delay: 1.6s; }
    .l4 { animation-delay: 2.3s; }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cursor {
      fill: #FFFFFF;
      animation: blink 1s step-end infinite;
      animation-delay: 2.6s;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .path { fill: #777777; font-family: 'Courier New', monospace; font-size: 12px; }
  </style>

  <rect class="bg" width="560" height="200" rx="10"/>
  <rect class="border" x="1" y="1" width="558" height="198" rx="10"/>

  <text x="24" y="34" class="path">/usr/bin/bUecoding</text>
  <line x1="24" y1="46" x2="536" y2="46" stroke="#222222" stroke-width="1"/>

  <g class="line l1">
    <text x="24" y="80" class="label">USER</text>
    <text x="140" y="80" class="value">bUecoding</text>
  </g>

  <g class="line l2">
    <text x="24" y="108" class="label">ROLE</text>
    <text x="140" y="108" class="value">Backend / Full-Stack Developer</text>
  </g>

  <g class="line l3">
    <text x="24" y="136" class="label">ORIGIN</text>
    <text x="140" y="136" class="value">Brazil</text>
  </g>

  <g class="line l4">
    <text x="24" y="164" class="label">STATUS</text>
    <text x="140" y="164" class="value">Building...</text>
    <rect class="cursor" x="290" y="153" width="8" height="14"/>
  </g>
</svg>
