<svg width="640" height="260" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg { fill: #0A0A0A; }
    .border {
      fill: none;
      stroke: #2A2A2A;
      stroke-width: 1.5;
      animation: glow 3.5s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { stroke: #2A2A2A; }
      50% { stroke: #5A5A5A; }
    }
    .path { fill: #777777; font-family: 'Courier New', monospace; font-size: 13px; }
    .label { fill: #666666; font-family: 'Courier New', monospace; font-size: 14px; }
    .value { fill: #FFFFFF; font-family: 'Courier New', monospace; font-size: 20px; font-weight: bold; }
    .row {
      opacity: 0;
      animation: reveal 0.45s ease forwards;
    }
    .r1 { animation-delay: 0.2s; }
    .r2 { animation-delay: 0.7s; }
    .r3 { animation-delay: 1.2s; }
    @keyframes reveal {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .streak-label { fill: #666666; font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 1px; }
    .streak-value { fill: #FFFFFF; font-family: 'Courier New', monospace; font-size: 26px; font-weight: bold; }
    .track { fill: none; stroke: #222222; stroke-width: 3; }
    .ring {
      fill: none;
      stroke: #FFFFFF;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 60 200;
      transform-origin: 526px 145px;
      animation: spin 3s linear infinite;
    }
    .ring2 {
      fill: none;
      stroke: #555555;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 20 220;
      transform-origin: 526px 145px;
      animation: spin-rev 5s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes spin-rev {
      from { transform: rotate(360deg); }
      to   { transform: rotate(0deg); }
    }
  </style>

  <rect class="bg" width="640" height="260" rx="12"/>
  <rect class="border" x="1.5" y="1.5" width="637" height="257" rx="12"/>

  <text x="28" y="38" class="path">/usr/bin/bUecoding/stats</text>
  <line x1="28" y1="52" x2="612" y2="52" stroke="#222222" stroke-width="1"/>

  <g class="row r1">
    <text x="28" y="100" class="label">TOTAL STARS</text>
    <text x="28" y="128" class="value">243</text>
  </g>

  <g class="row r2">
    <text x="28" y="168" class="label">TOTAL REPOS</text>
    <text x="28" y="196" class="value">27</text>
  </g>

  <g class="row r3">
    <text x="28" y="236" class="label">TOTAL COMMITS</text>
    <text x="82" y="236" class="value">132</text>
  </g>

  <g>
    <circle class="track" cx="526" cy="145" r="70"/>
    <circle class="ring" cx="526" cy="145" r="70"/>
    <circle class="ring2" cx="526" cy="145" r="55"/>
    <text x="526" y="138" text-anchor="middle" class="streak-label">STREAK</text>
    <text x="526" y="164" text-anchor="middle" class="streak-value">19</text>
  </g>
</svg>
